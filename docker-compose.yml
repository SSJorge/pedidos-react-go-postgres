name: pedidos_demo

services:
  postgres:
    image: postgres:16
    container_name: pedidos_postgres_demo
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos_admin
      POSTGRES_PASSWORD: pedidos_clave_2026
    ports:
      - "55432:5432"
    volumes:
      - pedidos_demo_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos_admin -d pedidos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pedidos_demo_data: